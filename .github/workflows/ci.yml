# G3 (D-113): every push and pull request. Typecheck, unit + backend tests on PostgreSQL 18,
# console build, backend image build. Deploys are a separate workflow (deploy.yml).
name: CI

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tgs
          POSTGRES_PASSWORD: tgs-ci-only
          POSTGRES_DB: tgseccsl_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tgs -d tgseccsl_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://tgs:tgs-ci-only@localhost:5432/tgseccsl_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The Member App's typed routes are generated by Expo, not committed (apps/member-app/.gitignore).
      - name: Generate Expo typed routes
        working-directory: apps/member-app
        run: |
          CI=1 npx expo start --port 8099 > "$RUNNER_TEMP/expo.log" 2>&1 &
          for i in $(seq 1 90); do [ -f .expo/types/router.d.ts ] && break; sleep 2; done
          kill %1 || true
          test -f .expo/types/router.d.ts || { cat "$RUNNER_TEMP/expo.log"; exit 1; }

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Domain, packages and mock API tests
        run: npm test

      - name: Backend tests (PostgreSQL 18)
        run: npm run test:backend

      - name: Admin Console build
        run: npm run build:console
        env:
          VITE_API_URL: https://api.example.invalid

      - name: Backend image build
        run: docker build -t tgseccsl-backend:ci .
